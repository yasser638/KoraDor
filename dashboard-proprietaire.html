<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korador — Espace propriétaire</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    .kd-dash-wrap{ padding: 50px 0 80px; }
    .kd-dash-header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:32px; }
    .kd-dash-title{ font-family:var(--font-display); font-size:32px; font-weight:800; color:var(--green-dark); margin-top:6px; }

    .kd-dash-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:36px; }
    .kd-dash-stat-card{
      background:#fff; border:1px solid var(--green-line); border-radius:14px; padding:20px 22px;
    }
    .kd-dash-stat-num{ font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--green-dark); }
    .kd-dash-stat-label{ font-size:12.5px; color:var(--text-soft); font-weight:600; margin-top:2px; }

    .kd-dash-section-title{ font-family:var(--font-display); font-size:19px; color:var(--green-dark); margin:36px 0 16px; }

    .kd-dash-empty{
      background:var(--cream-2); border-radius:14px; padding:32px; text-align:center; color:var(--text-soft); font-size:14px;
    }

    .kd-res-table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--green-line); border-radius:14px; overflow:hidden; }
    .kd-res-table th{
      text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-soft);
      padding:12px 16px; background:var(--cream-2); border-bottom:1px solid var(--green-line);
    }
    .kd-res-table td{ padding:14px 16px; font-size:13.5px; color:var(--green-dark); border-bottom:1px solid var(--green-line); vertical-align:middle; }
    .kd-res-table tr:last-child td{ border-bottom:none; }
    .kd-res-table td span.kd-res-sub{ display:block; font-size:12px; color:var(--text-soft); font-weight:400; }

    .kd-res-badge{
      display:inline-block; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700;
    }
    .kd-res-badge.en_attente{ background:#fdf3d9; color:#8a6600; }
    .kd-res-badge.confirmee{ background:#e2f4e6; color:var(--green-dark); }
    .kd-res-badge.annulee{ background:#fdecec; color:#b32e2e; }

    .kd-res-actions{ display:flex; gap:6px; }
    .kd-res-action-btn{
      border:1.5px solid var(--green-line); background:#fff; color:var(--green-dark);
      font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
      transition:border-color .15s ease, background .15s ease;
    }
    .kd-res-action-btn.confirm:hover{ border-color:var(--green-vivid); background:var(--cream-2); }
    .kd-res-action-btn.cancel:hover{ border-color:var(--red-accent); background:#fdecec; }
    .kd-res-action-btn:disabled{ opacity:.5; cursor:default; }

    .kd-dash-loading{ text-align:center; padding:60px 0; color:var(--text-soft); }

    @media (max-width:700px){
      .kd-res-table{ font-size:12.5px; }
      .kd-res-table th:nth-child(4), .kd-res-table td:nth-child(4){ display:none; } /* cache la colonne email sur mobile */
    }
  </style>
</head>
<body>

  <div class="site-layout">

    <nav class="navbar">
      <div class="brand">
        <span class="logo-ball"></span>
        <h2>Kora<span class="accent">dor</span></h2>
      </div>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
        </ul>
        <button class="btn-login" id="kd-logout-btn">Se déconnecter</button>
      </div>
    </nav>

    <main class="kd-dash-wrap">

      <div id="kd-dash-loading" class="kd-dash-loading">Chargement de ton tableau de bord...</div>

      <div id="kd-dash-content" hidden>
        <div class="kd-dash-header">
          <div>
            <span class="kd-eyebrow">Espace propriétaire</span>
            <h1 class="kd-dash-title" id="kd-dash-greeting">Bienvenue</h1>
          </div>
        </div>

        <div class="kd-dash-stats">
          <div class="kd-dash-stat-card">
            <div class="kd-dash-stat-num" id="kd-dash-stat-terrains">0</div>
            <div class="kd-dash-stat-label">Terrains gérés</div>
          </div>
          <div class="kd-dash-stat-card">
            <div class="kd-dash-stat-num" id="kd-dash-stat-count">0</div>
            <div class="kd-dash-stat-label">Réservations totales</div>
          </div>
          <div class="kd-dash-stat-card">
            <div class="kd-dash-stat-num" id="kd-dash-stat-confirmed">0</div>
            <div class="kd-dash-stat-label">Confirmées</div>
          </div>
          <div class="kd-dash-stat-card">
            <div class="kd-dash-stat-num" id="kd-dash-stat-revenue">0 DH</div>
            <div class="kd-dash-stat-label">Revenu estimé</div>
          </div>
        </div>

        <h2 class="kd-dash-section-title">Réservations</h2>
        <div id="kd-dash-reservations-wrap"></div>
      </div>

    </main>

    <footer class="footer">
      <p class="copyright">© 2026 Korador. Tous droits réservés.</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="dashboard-proprietaire.js"></script>

</body>
</html>
