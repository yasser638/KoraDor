<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korador — Mes réservations</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    .kd-mr-wrap{ padding: 50px 0 80px; max-width: 760px; margin: 0 auto; }
    .kd-mr-title{ font-family:var(--font-display); font-size:32px; font-weight:800; color:var(--green-dark); margin-top:6px; }
    .kd-mr-section-title{ font-family:var(--font-display); font-size:18px; color:var(--green-dark); margin:36px 0 14px; }

    .kd-mr-card{
      background:#fff; border:1px solid var(--green-line); border-radius:14px; padding:14px 22px 14px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; flex-wrap:wrap;
    }
    .kd-mr-card-left{ display:flex; align-items:center; gap:14px; }
    .kd-mr-card-photo{
      width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--cream-2);
    }
    .kd-mr-card-photo-fallback{
      width:56px; height:56px; border-radius:10px; flex-shrink:0; background:var(--green-dark);
      display:flex; align-items:center; justify-content:center; font-size:20px;
    }
    .kd-mr-card-main strong{ font-family:var(--font-display); font-size:15.5px; color:var(--green-dark); display:block; }
    .kd-mr-card-main .kd-mr-quartier{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--text-soft); margin-top:2px; }
    .kd-mr-card-when{ font-size:13.5px; color:var(--green-dark); font-weight:700; text-align:right; display:flex; align-items:center; gap:6px; }
    .kd-mr-card-when .kd-mr-when-text span{ display:block; font-size:11.5px; color:var(--text-soft); font-weight:600; }

    .kd-mr-badge{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; margin-top:6px; }
    .kd-mr-badge.en_attente{ background:#fdf3d9; color:#8a6600; }
    .kd-mr-badge.confirmee{ background:#e2f4e6; color:var(--green-dark); }
    .kd-mr-badge.annulee{ background:#fdecec; color:#b32e2e; }

    .kd-mr-actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .kd-mr-btn{
      border:1.5px solid var(--green-line); background:#fff; color:var(--green-dark);
      font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:8px; cursor:pointer; font-family:inherit;
      transition:border-color .15s ease, background .15s ease;
    }
    .kd-mr-btn.cancel:hover{ border-color:var(--red-accent); background:#fdecec; }
    .kd-mr-btn.review:hover{ border-color:var(--green-vivid); background:var(--cream-2); }
    .kd-mr-btn:disabled{ opacity:.5; cursor:default; }

    .kd-mr-empty{ background:var(--cream-2); border-radius:14px; padding:32px 28px; text-align:center; color:var(--text-soft); font-size:14px; }
    .kd-mr-empty-icon{ font-size:28px; margin-bottom:8px; }
    .kd-mr-loading{ text-align:center; padding:60px 0; color:var(--text-soft); }

    .kd-mr-skel-row{
      display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--green-line);
      border-radius:14px; padding:14px 22px; margin-bottom:12px;
    }
    .kd-mr-skel-photo{ width:56px; height:56px; border-radius:10px; flex-shrink:0; }
    .kd-mr-skel-lines{ flex:1; display:flex; flex-direction:column; gap:8px; }
    .kd-mr-skel-line{ height:12px; border-radius:6px; }
    .kd-mr-skel-line.w-60{ width:60%; }
    .kd-mr-skel-line.w-30{ width:30%; }

    /* Petite modale d'avis */
    .kd-avis-overlay{
      display:none; position:fixed; inset:0; background:rgba(15,30,16,0.5);
      align-items:center; justify-content:center; z-index:200; padding:20px;
    }
    .kd-avis-overlay.open{ display:flex; }
    .kd-avis-modal{ background:#fff; border-radius:16px; padding:28px; max-width:380px; width:100%; }
    .kd-avis-modal h3{ font-family:var(--font-display); color:var(--green-dark); font-size:18px; margin-bottom:6px; }
    .kd-avis-modal p{ font-size:13px; color:var(--text-soft); margin-bottom:18px; }
    .kd-avis-stars{ display:flex; gap:6px; justify-content:center; margin-bottom:18px; }
    .kd-avis-star{ font-size:32px; cursor:pointer; color:var(--green-line); transition:color .15s ease, transform .15s ease; background:none; border:none; }
    .kd-avis-star.active{ color:#f2b705; transform:scale(1.1); }
    .kd-avis-modal textarea{
      width:100%; border:1.5px solid var(--green-line); border-radius:10px; padding:10px 12px;
      font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px; margin-bottom:16px;
    }
    .kd-avis-modal-actions{ display:flex; gap:8px; }
  </style>
</head>
<body>

  <div class="site-layout">

    <nav class="navbar">
      <div class="brand">
        <span class="logo-ball"></span>
        <h2>Kora<span class="accent">dor</span></h2>
      </div>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="terrains.html">Terrains</a></li>
          <li><a href="mes-reservations.html" class="active">Mes réservations</a></li>
        </ul>
        <button class="btn-login" id="kd-logout-btn">Se déconnecter</button>
      </div>
    </nav>

    <main class="kd-mr-wrap">

      <div id="kd-mr-loading">
        <div class="kd-mr-skel-row">
          <div class="kd-mr-skel-photo kd-skel-shimmer"></div>
          <div class="kd-mr-skel-lines">
            <div class="kd-mr-skel-line w-60 kd-skel-shimmer"></div>
            <div class="kd-mr-skel-line w-30 kd-skel-shimmer"></div>
          </div>
        </div>
        <div class="kd-mr-skel-row">
          <div class="kd-mr-skel-photo kd-skel-shimmer"></div>
          <div class="kd-mr-skel-lines">
            <div class="kd-mr-skel-line w-60 kd-skel-shimmer"></div>
            <div class="kd-mr-skel-line w-30 kd-skel-shimmer"></div>
          </div>
        </div>
      </div>

      <div id="kd-mr-content" hidden>
        <span class="kd-eyebrow">Espace joueur</span>
        <h1 class="kd-mr-title">Mes réservations</h1>

        <h2 class="kd-mr-section-title">À venir</h2>
        <div id="kd-mr-upcoming"></div>

        <h2 class="kd-mr-section-title">Passées</h2>
        <div id="kd-mr-past"></div>
      </div>

    </main>

    <footer class="footer">
      <p class="copyright">© 2026 Korador. Tous droits réservés.</p>
    </footer>

  </div>

  <!-- Modale pour laisser un avis -->
  <div class="kd-avis-overlay" id="kd-avis-overlay">
    <div class="kd-avis-modal">
      <h3>Comment c'était ?</h3>
      <p id="kd-avis-terrain-name">Laisse ton avis sur ce terrain.</p>
      <div class="kd-avis-stars" id="kd-avis-stars">
        <button type="button" class="kd-avis-star" data-note="1">★</button>
        <button type="button" class="kd-avis-star" data-note="2">★</button>
        <button type="button" class="kd-avis-star" data-note="3">★</button>
        <button type="button" class="kd-avis-star" data-note="4">★</button>
        <button type="button" class="kd-avis-star" data-note="5">★</button>
      </div>
      <textarea id="kd-avis-comment" placeholder="Un commentaire (optionnel)..." maxlength="300"></textarea>
      <div class="kd-avis-modal-actions">
        <button type="button" class="kd-mr-btn" id="kd-avis-cancel-btn" style="flex:1;">Annuler</button>
        <button type="button" class="kd-btn-next" id="kd-avis-submit-btn" style="flex:1;">Envoyer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="reveal.js"></script>
  <script src="mes-reservations.js"></script>

</body>
</html>
